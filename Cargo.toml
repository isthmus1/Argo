[package]
name = "Argo"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["iterator"]
resolver = "3"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rucc-ast = "=0.30.15"
rucc-base = "=0.30.15"
rucc-diag = "=0.30.15"
rucc-lex = "=0.30.15"
rucc-parse = "=0.30.15"
rucc-session = "=0.30.15"
rucc-target = "=0.30.15"
