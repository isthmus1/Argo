[package]
name = "argo-db-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Generated SpacetimeDB bindings for argo-db, plus the shared protocol <-> row conversions."

[dependencies]
argo-protocol = { path = "../argo-protocol" }
serde.workspace = true
serde_json.workspace = true
spacetimedb-sdk.workspace = true

[dev-dependencies]
# A real multi-file project through the C front end, to check row locations against the files.
argo-c = { package = "Argo", path = "../argo" }
