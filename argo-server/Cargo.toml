[package]
name = "argo-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Owns a local SpacetimeDB (start, publish, stop) and ingests a C repository into it."

[dependencies]
argo-db-client = { path = "../argo-db-client" }
# The C front end (package `Argo`, library `main`): preprocess, parse and export a project.
argo-c = { package = "Argo", path = "../argo" }
clap.workspace = true
# Signals the host's process group: SIGINT for a clean stop, SIGKILL if it doesn't.
libc = "0.2"
# The loader child process hands the origin back as JSON (the rows go as BSATN).
serde_json.workspace = true
spacetimedb-sdk.workspace = true
# `net` and `io-util` for the host's HTTP readiness probe.
tokio = { workspace = true, features = ["net", "io-util"] }
