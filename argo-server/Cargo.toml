[package]
name = "argo-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Owns a local SpacetimeDB (start, publish, stop) and ingests a C repository into it."

[dependencies]
argo-db-client = { path = "../argo-db-client" }
# The C front end (package `Argo`, library `main`): preprocess, parse and export a project.
argo-c = { package = "Argo", path = "../argo" }
clap.workspace = true
# The model proxy (`proxy`): a small HTTP/1 server, worker keys from the OS RNG, and the client
# that forwards to the provider (the reqwest iterator uses).
bytes = "1"
getrandom = "0.3"
http-body-util = "0.1"
humantime = "2"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
# Signals the host's process group: SIGINT for a clean stop, SIGKILL if it doesn't.
libc = "0.2"
# The loader child process hands the origin back as JSON (the rows go as BSATN).
serde_json.workspace = true
spacetimedb-sdk.workspace = true
# `net` and `io-util` for the host's HTTP readiness probe.
tokio = { workspace = true, features = ["net", "io-util"] }
